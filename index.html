<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b14" />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="Y6T1IDqWrojWSKLzW4vx9LA6sCQiLg6ir12XAlgWEZI"
    />

    <!-- Primary SEO -->
    <title>
      CodeNova AI — AI-Powered Coding Platform | Practice DSA, Run Code &
      Crack Interviews
    </title>

    <meta
      name="title"
      content="CodeNova AI — AI-Powered Coding Platform"
    />

    <meta
      name="description"
      content="CodeNova AI is an AI-powered online coding platform where developers can practice DSA, run code in 19 languages, prepare for FAANG interviews, join coding contests, and learn with an AI mentor."
    />

    <meta
      name="keywords"
      content="AI coding platform, DSA practice, online compiler, coding interview preparation, LeetCode alternative, competitive programming, AI mentor, coding contests, JavaScript compiler, Python compiler, C++ compiler, programming learning platform"
    />

    <meta name="author" content="CodeNova AI" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://code-nova-ai.vercel.app/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://code-nova-ai.vercel.app/"
    />

    <meta
      property="og:title"
      content="CodeNova AI — AI-Powered Coding Platform"
    />

    <meta
      property="og:description"
      content="Practice DSA problems, run code online, join coding contests, and prepare for FAANG interviews with AI-powered guidance."
    />

    <meta property="og:site_name" content="CodeNova AI" />

    <meta property="og:locale" content="en_US" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="CodeNova AI — Practice Coding with AI"
    />

    <meta
      name="twitter:description"
      content="AI-powered coding platform with DSA practice, online compiler, contests, and interview preparation."
    />

    <meta name="twitter:site" content="@codenovaai" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CodeNova AI",
        "url": "https://code-nova-ai.vercel.app/",
        "description": "AI-powered coding platform with DSA practice, online compiler, coding contests, and interview preparation.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "creator": {
          "@type": "Organization",
          "name": "CodeNova AI"
        }
      }
    </script>

    <!-- FAQ Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is CodeNova AI free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, CodeNova AI provides a free coding platform with DSA problems, compiler access, and AI coding help."
            }
          },
          {
            "@type": "Question",
            "name": "Which programming languages are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "CodeNova AI supports JavaScript, Python, Java, C++, TypeScript, Go, Rust, PHP, and many more."
            }
          },
          {
            "@type": "Question",
            "name": "Can I prepare for coding interviews?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, the platform provides coding challenges, mock interviews, and AI guidance for interview preparation."
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
